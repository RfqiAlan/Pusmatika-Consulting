<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141715"/>
      <stop offset="100%" stop-color="#0a0d0b"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid1" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad1)"/>
  <rect width="1200" height="900" fill="url(#grid1)"/>

  <!-- Geometric & Calculus Curves -->
  <circle cx="850" cy="450" r="280" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" stroke-dasharray="8 6"/>
  <circle cx="850" cy="450" r="180" fill="none" stroke="#4ade80" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Calculus Continuous Wave -->
  <path d="M 100 550 C 350 300, 550 700, 850 450 S 1100 200, 1180 350" fill="none" stroke="url(#accentGrad1)" stroke-width="3.5"/>
  <path d="M 100 580 C 350 330, 550 730, 850 480 S 1100 230, 1180 380" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Large Watermark Symbol -->
  <text x="820" y="560" font-family="serif" font-size="340" font-weight="bold" fill="#ffffff" fill-opacity="0.05" text-anchor="middle">∫</text>

  <!-- Card Labels -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1" stroke-opacity="0.3"/>
    <text x="70" y="21" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#4ade80" text-anchor="middle" letter-spacing="2">MODUL 01</text>

    <text x="0" y="90" font-family="system-ui, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="2">BIDANG ANALISIS</text>
    <text x="0" y="130" font-family="'Courier New', monospace" font-size="15" font-weight="600" fill="#9ca3af" letter-spacing="4">ANALISIS RIIL &amp; KALKULUS LANJUT</text>
  </g>

  <!-- Technical Spec Details -->
  <g transform="translate(100, 720)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="13" fill="#6b7280" letter-spacing="2">FOCUS // RUANG METRIK • BANACH • TEORI UKURAN LEBESGUE</text>
    <text x="0" y="30" font-family="'Courier New', monospace" font-size="11" fill="#4ade80" letter-spacing="1">STATUS // MODUL UTAMA • PUSMATIKA RESEARCH DEPT</text>
  </g>
</svg>
