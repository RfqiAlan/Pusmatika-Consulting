<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0d0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <pattern id="dotGrid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Deep Dark Concrete Base -->
  <rect width="800" height="800" fill="#0d110e"/>
  <rect width="800" height="800" fill="url(#dotGrid1)"/>
  <circle cx="400" cy="400" r="380" fill="url(#glow1)"/>

  <!-- Calculus Contour Rings -->
  <g fill="none" stroke-linecap="round">
    <circle cx="400" cy="400" r="320" stroke="#ffffff" stroke-width="1" stroke-opacity="0.07" stroke-dasharray="8 6"/>
    <circle cx="400" cy="400" r="260" stroke="#4ade80" stroke-width="1.2" stroke-opacity="0.2"/>
    <circle cx="400" cy="400" r="200" stroke="#ffffff" stroke-width="1" stroke-opacity="0.07"/>
    <circle cx="400" cy="400" r="140" stroke="#4ade80" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  </g>

  <!-- Continuous Calculus Harmonic Waves -->
  <path d="M 80 400 C 200 240, 320 560, 400 400 S 600 240, 720 400" fill="none" stroke="url(#curveGrad1)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 80 430 C 200 270, 320 590, 400 430 S 600 270, 720 430" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.4"/>
  <path d="M 80 370 C 200 210, 320 530, 400 370 S 600 210, 720 370" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Coordinate Crosshair Axes -->
  <line x1="400" y1="80" x2="400" y2="720" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
  <line x1="80" y1="400" x2="720" y2="400" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Centered Icon & Badge -->
  <circle cx="400" cy="400" r="64" fill="#141a16" stroke="#4ade80" stroke-width="2" stroke-opacity="0.6"/>
  <text x="400" y="426" font-family="serif" font-size="76" font-weight="bold" fill="#4ade80" text-anchor="middle">∫</text>

  <!-- Elegant Corner Editorial Badges -->
  <text x="50" y="70" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#4ade80" letter-spacing="3">PUSMATIKA // MODUL 01</text>
  <text x="50" y="750" font-family="'Courier New', monospace" font-size="11" fill="#6b7280" letter-spacing="2">BIDANG ANALISIS • KALKULUS LANJUT</text>
  <text x="750" y="750" font-family="'Courier New', monospace" font-size="11" fill="#6b7280" text-anchor="end" letter-spacing="2">∫ f(x) dμ</text>
</svg>
