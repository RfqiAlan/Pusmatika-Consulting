<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="glow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0c0e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Deep Dark Concrete Base -->
  <rect width="800" height="800" fill="#0d110d"/>
  <rect width="800" height="800" fill="url(#dotGrid4)"/>
  <circle cx="400" cy="400" r="380" fill="url(#glow4)"/>

  <!-- Phase Space Limit Cycle & Spiral Trajectories -->
  <g transform="translate(400, 400)" fill="none" stroke-linecap="round">
    <!-- Concentric Attractor Ellipses -->
    <ellipse cx="0" cy="0" rx="300" ry="200" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="8 6" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="230" ry="150" stroke="#a3e635" stroke-width="1.8" stroke-opacity="0.35" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="160" ry="100" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" transform="rotate(-30)"/>

    <!-- Inward Spiral Trajectory Path -->
    <path d="M 0 0 A 30 30 0 0 1 45 15 A 65 65 0 0 1 75 -50 A 105 105 0 0 1 -25 -120 A 160 160 0 0 1 -160 30 A 220 220 0 0 1 70 220" stroke="#a3e635" stroke-width="2.5" stroke-opacity="0.8"/>
    <path d="M 0 0 A 25 25 0 0 0 -35 -10 A 55 55 0 0 0 -60 40 A 90 90 0 0 0 20 100 A 140 140 0 0 0 130 -30 A 190 190 0 0 0 -60 -190" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 4"/>

    <!-- Coordinate Flow Axes -->
    <line x1="-340" y1="0" x2="340" y2="0" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
    <line x1="0" y1="-340" x2="0" y2="340" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
  </g>

  <!-- Centered Icon & Badge -->
  <circle cx="400" cy="400" r="64" fill="#141a13" stroke="#a3e635" stroke-width="2" stroke-opacity="0.6"/>
  <text x="400" y="426" font-family="serif" font-size="76" font-weight="bold" fill="#a3e635" text-anchor="middle">∂</text>

  <!-- Elegant Corner Editorial Badges -->
  <text x="50" y="70" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#a3e635" letter-spacing="3">PUSMATIKA // MODUL 04</text>
  <text x="50" y="750" font-family="'Courier New', monospace" font-size="11" fill="#6b7280" letter-spacing="2">MATEMATIKA TERAPAN • SIMULASI DINAMIK</text>
  <text x="750" y="750" font-family="'Courier New', monospace" font-size="11" fill="#6b7280" text-anchor="end" letter-spacing="2">dx/dt = f(x, t) • ∇·F = 0</text>
</svg>
