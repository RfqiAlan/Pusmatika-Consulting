<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a17"/>
      <stop offset="100%" stop-color="#0b0d0a"/>
    </linearGradient>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad4)"/>
  <rect width="1200" height="900" fill="url(#grid4)"/>

  <!-- Dynamical System Phase Portrait Spiral -->
  <g transform="translate(860, 450)">
    <!-- Spiral streamlines -->
    <path d="M 0 0 A 50 50 0 0 1 70 20 A 100 100 0 0 1 120 -80 A 160 160 0 0 1 -40 -180 A 240 240 0 0 1 -240 50 A 320 320 0 0 1 100 320" fill="none" stroke="#a3e635" stroke-width="2.5" stroke-opacity="0.75"/>
    <path d="M 0 0 A 40 40 0 0 0 -50 -10 A 90 90 0 0 0 -90 60 A 140 140 0 0 0 30 150 A 210 210 0 0 0 190 -40 A 280 280 0 0 0 -80 -270" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="8 6"/>
    <!-- Center Equilibrium Point -->
    <circle cx="0" cy="0" r="8" fill="#a3e635"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#a3e635" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>

  <!-- Large Watermark Symbol -->
  <text x="890" y="550" font-family="serif" font-size="320" font-weight="bold" fill="#ffffff" fill-opacity="0.04" text-anchor="middle">∂</text>

  <!-- Card Labels -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#a3e635" fill-opacity="0.15" stroke="#a3e635" stroke-width="1" stroke-opacity="0.3"/>
    <text x="70" y="21" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#a3e635" text-anchor="middle" letter-spacing="2">MODUL 04</text>

    <text x="0" y="90" font-family="system-ui, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="2">MATEMATIKA TERAPAN</text>
    <text x="0" y="130" font-family="'Courier New', monospace" font-size="15" font-weight="600" fill="#9ca3af" letter-spacing="4">PEMODELAN DINAMIK &amp; NUMERIK</text>
  </g>

  <!-- Technical Spec Details -->
  <g transform="translate(100, 720)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="13" fill="#6b7280" letter-spacing="2">FOCUS // PERSAMAAN DIFERENSIAL • LYAPUNOV • SIMULASI NUMERIK</text>
    <text x="0" y="30" font-family="'Courier New', monospace" font-size="11" fill="#a3e635" letter-spacing="1">STATUS // MODUL UTAMA • PUSMATIKA RESEARCH DEPT</text>
  </g>
</svg>
