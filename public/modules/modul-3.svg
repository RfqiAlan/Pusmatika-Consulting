<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090d12" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Deep Dark Concrete Base -->
  <rect width="800" height="800" fill="#0a0f14"/>
  <rect width="800" height="800" fill="url(#dotGrid3)"/>
  <circle cx="400" cy="400" r="380" fill="url(#glow3)"/>

  <!-- Graph Orbit Rings -->
  <circle cx="400" cy="400" r="280" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6 6"/>

  <!-- Network Edges (Complete Graph K6 Geometry) -->
  <g stroke-linecap="round">
    <!-- Star Polygon Edges -->
    <polygon points="400,160 610,280 610,520 400,640 190,520 190,280" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
    <polygon points="400,160 610,520 190,520" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="6 4"/>
    <polygon points="610,280 400,640 190,280" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="6 4"/>

    <!-- Cross Connection Rays -->
    <line x1="400" y1="160" x2="400" y2="640" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
    <line x1="190" y1="280" x2="610" y2="520" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
    <line x1="190" y1="520" x2="610" y2="280" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Vertex Nodes -->
    <circle cx="400" cy="160" r="12" fill="#38bdf8"/>
    <circle cx="610" cy="280" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="610" cy="520" r="14" fill="#38bdf8"/>
    <circle cx="400" cy="640" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="190" cy="520" r="14" fill="#38bdf8"/>
    <circle cx="190" cy="280" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Centered Icon & Badge -->
  <circle cx="400" cy="400" r="64" fill="#0d1722" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
  <text x="400" y="424" font-family="serif" font-size="70" font-weight="bold" fill="#38bdf8" text-anchor="middle">∢</text>

  <!-- Elegant Corner Editorial Badges -->
  <text x="50" y="70" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#38bdf8" letter-spacing="3">PUSMATIKA // MODUL 03</text>
  <text x="50" y="750" font-family="'Courier New', monospace" font-size="11" fill="#6b7280" letter-spacing="2">BIDANG KOMBINATORIKA • GRAF &amp; DISKRIT</text>
  <text x="750" y="750" font-family="'Courier New', monospace" font-size="11" fill="#6b7280" text-anchor="end" letter-spacing="2">G = (V, E) • χ(G) ≤ 4</text>
</svg>
