<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181c"/>
      <stop offset="100%" stop-color="#0a0d10"/>
    </linearGradient>
    <pattern id="grid3" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1" fill="#ffffff" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad3)"/>
  <rect width="1200" height="900" fill="url(#grid3)"/>

  <!-- Graph Network Constellation -->
  <g transform="translate(620, 220)">
    <!-- Edges -->
    <line x1="150" y1="80" x2="350" y2="120" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
    <line x1="350" y1="120" x2="420" y2="340" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.7"/>
    <line x1="420" y1="340" x2="260" y2="440" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.7"/>
    <line x1="260" y1="440" x2="90" y2="300" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
    <line x1="90" y1="300" x2="150" y2="80" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6 4"/>
    <line x1="150" y1="80" x2="420" y2="340" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6 4"/>
    <line x1="350" y1="120" x2="260" y2="440" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6 4"/>
    <line x1="90" y1="300" x2="350" y2="120" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

    <!-- Nodes -->
    <circle cx="150" cy="80" r="10" fill="#38bdf8" fill-opacity="0.8"/>
    <circle cx="350" cy="120" r="14" fill="#38bdf8"/>
    <circle cx="420" cy="340" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="260" cy="440" r="12" fill="#38bdf8"/>
    <circle cx="90" cy="300" r="10" fill="#38bdf8" fill-opacity="0.8"/>
  </g>

  <!-- Large Watermark Symbol -->
  <text x="890" y="520" font-family="serif" font-size="280" font-weight="bold" fill="#ffffff" fill-opacity="0.04" text-anchor="middle">∢</text>

  <!-- Card Labels -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
    <text x="70" y="21" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">MODUL 03</text>

    <text x="0" y="90" font-family="system-ui, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="2">BIDANG KOMBINATORIKA</text>
    <text x="0" y="130" font-family="'Courier New', monospace" font-size="15" font-weight="600" fill="#9ca3af" letter-spacing="4">TEORI GRAF &amp; STRUKTUR DISKRIT</text>
  </g>

  <!-- Technical Spec Details -->
  <g transform="translate(100, 720)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="13" fill="#6b7280" letter-spacing="2">FOCUS // TEORI GRAF • LINTASAN OPTIMAL • RELASI REKURENSI</text>
    <text x="0" y="30" font-family="'Courier New', monospace" font-size="11" fill="#38bdf8" letter-spacing="1">STATUS // MODUL UTAMA • PUSMATIKA RESEARCH DEPT</text>
  </g>
</svg>
