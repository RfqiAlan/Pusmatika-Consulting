<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="glow5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#110a0c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="areaGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="dotGrid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Deep Dark Concrete Base -->
  <rect width="800" height="800" fill="#140d0f"/>
  <rect width="800" height="800" fill="url(#dotGrid5)"/>
  <circle cx="400" cy="400" r="380" fill="url(#glow5)"/>

  <!-- Actuarial Life Table & Probability Density Distribution -->
  <g transform="translate(100, 200)">
    <!-- Base Axes -->
    <line x1="40" y1="400" x2="560" y2="400" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2"/>
    <line x1="40" y1="80" x2="40" y2="400" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2"/>

    <!-- Gaussian Hazard Curve Area -->
    <path d="M 40 400 Q 180 395, 300 160 T 560 400 Z" fill="url(#areaGrad5)"/>
    <path d="M 40 400 Q 180 395, 300 160 T 560 400" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>

    <!-- Secondary Actuarial Discount Horizon -->
    <path d="M 40 400 C 140 370, 260 280, 560 120" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6"/>

    <!-- Confidence Interval Bounds -->
    <line x1="300" y1="160" x2="300" y2="400" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.5"/>
    <circle cx="300" cy="160" r="9" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
    <circle cx="420" cy="275" r="7" fill="#f43f5e"/>
    <circle cx="180" cy="380" r="7" fill="#f43f5e"/>
  </g>

  <!-- Centered Icon & Badge -->
  <circle cx="400" cy="400" r="64" fill="#1d1114" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.6"/>
  <text x="400" y="424" font-family="serif" font-size="70" font-weight="bold" fill="#f43f5e" text-anchor="middle">ℜ</text>

  <!-- Elegant Corner Editorial Badges -->
  <text x="50" y="70" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#f43f5e" letter-spacing="3">PUSMATIKA // MODUL 05</text>
  <text x="50" y="750" font-family="'Courier New', monospace" font-size="11" fill="#6b7280" letter-spacing="2">BIDANG AKTUARIA • KONTINJENSI &amp; RISIKO</text>
  <text x="750" y="750" font-family="'Courier New', monospace" font-size="11" fill="#6b7280" text-anchor="end" letter-spacing="2">Ax = ∫ e^(-δt) tpx μx+t dt</text>
</svg>
