<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1716"/>
      <stop offset="100%" stop-color="#0e0a09"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="grid5" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad5)"/>
  <rect width="1200" height="900" fill="url(#grid5)"/>

  <!-- Actuarial Mortality Curve & Chart Area -->
  <g transform="translate(600, 240)">
    <!-- Baseline Axes -->
    <line x1="0" y1="420" x2="520" y2="420" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2"/>
    <line x1="0" y1="50" x2="0" y2="420" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2"/>

    <!-- Filled Risk Distribution Area -->
    <path d="M 0 420 Q 150 410, 260 320 T 420 180 T 500 80 L 500 420 Z" fill="url(#chartGrad)"/>
    <!-- Growth / Life Contingency Curves -->
    <path d="M 0 420 Q 150 410, 260 320 T 420 180 T 500 80" fill="none" stroke="#f43f5e" stroke-width="3"/>
    <path d="M 0 420 Q 180 370, 320 250 T 500 140" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 4"/>

    <!-- Key Risk Threshold Dots -->
    <circle cx="260" cy="320" r="7" fill="#f43f5e"/>
    <circle cx="420" cy="180" r="9" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
    <circle cx="500" cy="80" r="7" fill="#f43f5e"/>
  </g>

  <!-- Large Watermark Symbol -->
  <text x="890" y="520" font-family="serif" font-size="280" font-weight="bold" fill="#ffffff" fill-opacity="0.04" text-anchor="middle">ℜ</text>

  <!-- Card Labels -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.3"/>
    <text x="70" y="21" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#f43f5e" text-anchor="middle" letter-spacing="2">MODUL 05</text>

    <text x="0" y="90" font-family="system-ui, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="2">BIDANG AKTUARIA</text>
    <text x="0" y="130" font-family="'Courier New', monospace" font-size="15" font-weight="600" fill="#9ca3af" letter-spacing="4">KONTINJENSI HIDUP &amp; RISIKO FINANSIAL</text>
  </g>

  <!-- Technical Spec Details -->
  <g transform="translate(100, 720)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="13" fill="#6b7280" letter-spacing="2">FOCUS // TABEL MORTALITA • CADANGAN PREMI • UJIAN PAI &amp; SOA</text>
    <text x="0" y="30" font-family="'Courier New', monospace" font-size="11" fill="#f43f5e" letter-spacing="1">STATUS // MODUL UTAMA • PUSMATIKA RESEARCH DEPT</text>
  </g>
</svg>
