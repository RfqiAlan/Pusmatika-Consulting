<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="glow6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0c14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid6" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="30" height="30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Deep Dark Concrete Base -->
  <rect width="800" height="800" fill="#0c0e16"/>
  <rect width="800" height="800" fill="url(#dotGrid6)"/>
  <circle cx="400" cy="400" r="380" fill="url(#glow6)"/>

  <!-- Enterprise Big Data Architecture Blocks -->
  <g transform="translate(180, 220)">
    <!-- Main Ingestion Node -->
    <rect x="0" y="30" width="120" height="70" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8"/>
    <text x="60" y="72" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#818cf8" text-anchor="middle">INGEST</text>

    <!-- Core Compute Cluster -->
    <path d="M 120 65 L 200 65" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="200" y="10" width="160" height="110" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="2.2"/>
    <text x="280" y="62" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">BIG DATA</text>
    <text x="280" y="84" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc" text-anchor="middle">PIPELINE</text>

    <!-- Branch Downwards to ML & Database -->
    <path d="M 280 120 L 280 200 L 160 200 L 160 250" fill="none" stroke="#818cf8" stroke-width="1.8"/>
    <rect x="80" y="250" width="160" height="70" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8"/>
    <text x="160" y="292" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#a5b4fc" text-anchor="middle">ML MODELS</text>

    <path d="M 280 120 L 280 200 L 380 200 L 380 250" fill="none" stroke="#818cf8" stroke-width="1.8"/>
    <rect x="300" y="250" width="160" height="70" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8"/>
    <text x="380" y="292" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#a5b4fc" text-anchor="middle">DATA LAKE</text>
  </g>

  <!-- Concentric Digital Pulse Ring -->
  <circle cx="400" cy="400" r="280" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6 8"/>

  <!-- Centered Icon & Badge -->
  <circle cx="400" cy="400" r="64" fill="#131428" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6"/>
  <text x="400" y="424" font-family="serif" font-size="64" font-weight="bold" fill="#818cf8" text-anchor="middle">⌘</text>

  <!-- Elegant Corner Editorial Badges -->
  <text x="50" y="70" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#818cf8" letter-spacing="3">PUSMATIKA // MODUL 06</text>
  <text x="50" y="750" font-family="'Courier New', monospace" font-size="11" fill="#6b7280" letter-spacing="2">BIDANG PEMROGRAMAN &amp; BIG DATA</text>
  <text x="750" y="750" font-family="'Courier New', monospace" font-size="11" fill="#6b7280" text-anchor="end" letter-spacing="2">O(n log n) • Spark • NoSQL</text>
</svg>
