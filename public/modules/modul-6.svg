<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171a"/>
      <stop offset="100%" stop-color="#090b0d"/>
    </linearGradient>
    <pattern id="grid6" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad6)"/>
  <rect width="1200" height="900" fill="url(#grid6)"/>

  <!-- Big Data Pipeline Architecture Diagram Blocks -->
  <g transform="translate(640, 220)">
    <!-- Data Stream Blocks -->
    <rect x="50" y="60" width="160" height="90" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <text x="130" y="112" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#818cf8" text-anchor="middle">INGESTION</text>

    <!-- Connector line -->
    <line x1="210" y1="105" x2="280" y2="105" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 3"/>

    <!-- Middle cluster -->
    <rect x="280" y="40" width="190" height="130" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="2.5"/>
    <text x="375" y="100" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">BIG DATA</text>
    <text x="375" y="125" font-family="'Courier New', monospace" font-size="11" fill="#818cf8" text-anchor="middle">PIPELINE CORE</text>

    <!-- Branch to ML -->
    <path d="M 375 170 L 375 250 L 220 250 L 220 310" fill="none" stroke="#818cf8" stroke-width="2"/>
    <rect x="130" y="310" width="180" height="90" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="220" y="362" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#a5b4fc" text-anchor="middle">MACHINE LEARNING</text>

    <!-- Branch to DB -->
    <path d="M 375 170 L 375 250 L 410 250 L 410 310" fill="none" stroke="#818cf8" stroke-width="2"/>
    <rect x="320" y="310" width="180" height="90" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="410" y="362" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#a5b4fc" text-anchor="middle">ENTERPRISE DB</text>
  </g>

  <!-- Large Watermark Symbol -->
  <text x="890" y="520" font-family="serif" font-size="280" font-weight="bold" fill="#ffffff" fill-opacity="0.04" text-anchor="middle">⌘</text>

  <!-- Card Labels -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3"/>
    <text x="70" y="21" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#818cf8" text-anchor="middle" letter-spacing="2">MODUL 06</text>

    <text x="0" y="90" font-family="system-ui, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="2">PEMROGRAMAN &amp; DATA</text>
    <text x="0" y="130" font-family="'Courier New', monospace" font-size="15" font-weight="600" fill="#9ca3af" letter-spacing="4">BIG DATA &amp; SAINS KOMPUTASI</text>
  </g>

  <!-- Technical Spec Details -->
  <g transform="translate(100, 720)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="13" fill="#6b7280" letter-spacing="2">FOCUS // BASIS DATA ENTERPRISE • MACHINE LEARNING • DATA PIPELINE</text>
    <text x="0" y="30" font-family="'Courier New', monospace" font-size="11" fill="#818cf8" letter-spacing="1">STATUS // MODUL UTAMA • PUSMATIKA RESEARCH DEPT</text>
  </g>
</svg>
