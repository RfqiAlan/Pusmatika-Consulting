<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191714"/>
      <stop offset="100%" stop-color="#0d0c0a"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid2" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad2)"/>
  <rect width="1200" height="900" fill="url(#grid2)"/>

  <!-- Matrix & Cryptography Elements -->
  <g transform="translate(720, 260)">
    <!-- Outer concentric rotated squares -->
    <rect x="0" y="0" width="340" height="340" rx="20" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.25" transform="rotate(45 170 170)"/>
    <rect x="40" y="40" width="260" height="260" rx="10" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="10 5" transform="rotate(22.5 170 170)"/>
    <circle cx="170" cy="170" r="110" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3"/>
  </g>

  <!-- Large Watermark Symbol -->
  <text x="890" y="490" font-family="serif" font-size="280" font-weight="bold" fill="#ffffff" fill-opacity="0.04" text-anchor="middle">⊗</text>

  <!-- Card Labels -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
    <text x="70" y="21" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="2">MODUL 02</text>

    <text x="0" y="90" font-family="system-ui, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="2">BIDANG ALJABAR</text>
    <text x="0" y="130" font-family="'Courier New', monospace" font-size="15" font-weight="600" fill="#9ca3af" letter-spacing="4">STRUKTUR ALJABAR &amp; KRIPTOGRAFI</text>
  </g>

  <!-- Technical Spec Details -->
  <g transform="translate(100, 720)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="13" fill="#6b7280" letter-spacing="2">FOCUS // TEORI GRUP • RING • RUANG VEKTOR • MODUL TEORI</text>
    <text x="0" y="30" font-family="'Courier New', monospace" font-size="11" fill="#f59e0b" letter-spacing="1">STATUS // MODUL UTAMA • PUSMATIKA RESEARCH DEPT</text>
  </g>
</svg>
