<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0e0c0a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Deep Dark Concrete Base -->
  <rect width="800" height="800" fill="#12100d"/>
  <rect width="800" height="800" fill="url(#dotGrid2)"/>
  <circle cx="400" cy="400" r="380" fill="url(#glow2)"/>

  <!-- Geometric Algebraic Lattice (Rotated Squares & Polygons) -->
  <g transform="translate(400, 400)" fill="none" stroke-linecap="round">
    <rect x="-220" y="-220" width="440" height="440" rx="24" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" transform="rotate(45)"/>
    <rect x="-170" y="-170" width="340" height="340" rx="16" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.35" transform="rotate(22.5)"/>
    <rect x="-120" y="-120" width="240" height="240" rx="12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>
    <circle cx="0" cy="0" r="260" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="8 6"/>

    <!-- Diagonal Projection Rays -->
    <line x1="-240" y1="-240" x2="240" y2="240" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.1"/>
    <line x1="-240" y1="240" x2="240" y2="-240" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.1"/>
  </g>

  <!-- Centered Icon & Badge -->
  <circle cx="400" cy="400" r="64" fill="#1c1712" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.6"/>
  <text x="400" y="424" font-family="serif" font-size="70" font-weight="bold" fill="#f59e0b" text-anchor="middle">⊗</text>

  <!-- Elegant Corner Editorial Badges -->
  <text x="50" y="70" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#f59e0b" letter-spacing="3">PUSMATIKA // MODUL 02</text>
  <text x="50" y="750" font-family="'Courier New', monospace" font-size="11" fill="#6b7280" letter-spacing="2">BIDANG ALJABAR • STRUKTUR &amp; KRIPTO</text>
  <text x="750" y="750" font-family="'Courier New', monospace" font-size="11" fill="#6b7280" text-anchor="end" letter-spacing="2">V ⊗ W ≅ Hom(V*, W)</text>
</svg>
